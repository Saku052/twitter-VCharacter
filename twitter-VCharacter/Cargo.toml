[package]
name = "twitter-VCharacter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
async-trait = "0.1.89"
base64 = "0.22.1"
dotenvy = "0.15.7"
hmac = "0.13.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.52.1", features = ["full"] }
